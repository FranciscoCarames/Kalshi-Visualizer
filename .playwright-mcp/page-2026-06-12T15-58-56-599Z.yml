          - generic [ref=e4356]:
            - generic [ref=e4357]: The cheapest Buy-NO you can take — a single directional fade (you win if the outcome does NOT happen). A cheap NO is cheap because the market thinks the YES is likely — this is NOT an edge. Gross, top-of-book, uncalibrated. (The 2-leg bounded 'bands' are off by default; switch the 'NO-fade kind' filter to see them.)
            - generic [ref=e4358]: Split by SETTLEMENT LEVEL — how the contract settles, NOT the sport's naming. Event = a single contest (game/match/race; incl. a golf or motorsport field result — a single field outcome, not a bracket above another contest). Tournament = one level up (a best-of-7 series, win the French Open / World Cup / Super Bowl, an F1 season). Championship = two levels up (NBA/NHL/MLB titles, which sit above a best-of-7 series layer; the tennis Grand Slam). So 'win the NBA title' is Championship, but 'win the World Cup' is Tournament.
            - generic [ref=e4359]: Championship 'Title-path tournaments / events' columns = the sport's CANONICAL longest path to the title (the constituent series/majors and possible games; byes/play-in shorten it for top seeds). Display-only — not this row's remaining path, not a probability or EV.
            - generic [ref=e4360]: Days to close = calendar days from this snapshot to the faded contract's close (the later leg for bands — the full hold). 'Best-case mult/day' (hidden by default) = best-case profit ÷ cost (outright) or ÷ max loss (band), per day — a gross, top-of-book MULTIPLE, NOT expected value and NOT annualized return. Blank when the close is unknown or already passed.
            - generic [ref=e4361]: Cheapness vs field (pp) = the faded contract's market-implied chance minus the field-de-vigged chance at its ladder node (positive = the NO looks cheap vs the de-vigged field). The participant's OWN price is INCLUDED in the field (self-inclusive), so it is a rough peer-relative comparison — NOT an edge, fair value, or independent estimate. Blank when the node's survivor count is unmapped, the field is unpriceable/sparse, or the quote isn't Tight/OK. Gross, top-of-book, uncalibrated.
