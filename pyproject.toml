[tool.ruff]
line-length = 120
target-version = "py313"
# Vendored skills + Claude Code tooling (hooks, statusline, skill scripts) live under .claude/ — they are
# third-party / tooling code, not project source, so they are not linted by the project's ruff config.
extend-exclude = [".claude"]

[tool.ruff.lint]
# E/W: pycodestyle errors/warnings  F: pyflakes  I: isort
select = ["E", "F", "W", "I"]
# E501: line-length — many dataframe / table-config lines intentionally exceed 120
ignore = ["E501"]

[tool.pytest.ini_options]
# NiceGUI's `user` fixture is an async fixture → pytest-asyncio in auto mode runs it (and the async
# browser smoke tests) without a per-test marker. Only affects async tests; the sync suite is unchanged.
asyncio_mode = "auto"
markers = [
    "nicegui_main_file: the NiceGUI main file to run for the headless User simulation (tests/test_browser.py)",
]
